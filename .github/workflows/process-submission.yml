name: Process Submission

on:
  issues:
    types: [opened]

jobs:
  process:
    if: startsWith(github.event.issue.title, '[submission]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gobuster
        run: sudo apt-get install -y gobuster
        continue-on-error: true

      - name: Extract URL from issue title
        id: extract
        run: |
          TITLE="${{ github.event.issue.title }}"
          URL="${TITLE#\[submission\] }"
          URL=$(echo "$URL" | xargs)
          if [[ "$URL" != http* ]]; then URL="https://$URL"; fi
          DOMAIN=$(echo "$URL" | sed 's|https\?://||' | cut -d'/' -f1)
          echo "url=$URL"       >> $GITHUB_OUTPUT
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT

      - name: Parse display metadata from issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "$ISSUE_BODY" > /tmp/submission.json
          python3 -c "
          import json
          try:
              d = json.load(open('/tmp/submission.json'))
              print('display_name=' + d.get('display_name',''))
              print('display_loc='  + d.get('display_loc',''))
          except:
              print('display_name=')
              print('display_loc=')
          " >> $GITHUB_OUTPUT

      - name: Run gobuster-recon
        env:
          URL:    ${{ steps.extract.outputs.url }}
          DOMAIN: ${{ steps.extract.outputs.domain }}
        run: |
          python3 gobuster-recon.py -u "$URL" -o "web/data/targets/${DOMAIN}.json" --no-cache

      - name: Merge metadata and update index.json
        env:
          URL:          ${{ steps.extract.outputs.url }}
          DOMAIN:       ${{ steps.extract.outputs.domain }}
          DISPLAY_NAME: ${{ steps.parse.outputs.display_name }}
          DISPLAY_LOC:  ${{ steps.parse.outputs.display_loc }}
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime

          url          = os.environ['URL']
          domain       = os.environ['DOMAIN']
          display_name = os.environ.get('DISPLAY_NAME', '')
          display_loc  = os.environ.get('DISPLAY_LOC',  '')
          now          = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
          target_file  = f'web/data/targets/{domain}.json'
          index_file   = 'web/data/index.json'

          with open(target_file) as f:
              data = json.load(f)
          data['display_name']   = display_name or 'anonymous'
          data['display_loc']    = display_loc
          data['last_refreshed'] = now
          with open(target_file, 'w') as f:
              json.dump(data, f, indent=2)

          entry = {
              'd':             domain,
              'url':           url,
              'display_name':  display_name or 'anonymous',
              'display_loc':   display_loc,
              'scanned_at':    data.get('scanned_at', now),
              'last_refreshed': now,
              'finding_count': data.get('finding_count', 0),
              'status_2xx':    data.get('status_2xx', 0),
              'status_3xx':    data.get('status_3xx', 0),
              'has_admin':     bool(data.get('has_admin')),
              'has_login':     bool(data.get('has_login')),
              'has_phpmyadmin': bool(data.get('has_phpmyadmin')),
              'has_git':       bool(data.get('has_git')),
              'has_env':       bool(data.get('has_env')),
              'has_backup':    bool(data.get('has_backup')),
              'mode':          data.get('mode', 'dir'),
              'method':        data.get('method', 'gobuster'),
              'wordlist':      data.get('wordlist', ''),
          }

          try:
              with open(index_file) as f:
                  index = json.load(f)
          except:
              index = {'total_targets': 0, 'targets': []}

          existing = [t for t in index.get('targets', []) if t['d'] != domain]
          existing.append(entry)
          existing.sort(key=lambda t: -(t.get('finding_count', 0)))
          index['targets']       = existing
          index['total_targets'] = len(existing)
          with open(index_file, 'w') as f:
              json.dump(index, f, indent=2)
          print(f'[OK] {domain} added/updated')
          PYEOF

      - name: Commit data
        env:
          DOMAIN: ${{ steps.extract.outputs.domain }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/
          git diff --cached --quiet || git commit -m "data: add $DOMAIN [skip ci]"
          git push

      - name: Close issue
        uses: actions/github-script@v7
        env:
          DOMAIN: ${{ steps.extract.outputs.domain }}
        with:
          script: |
            const domain = process.env.DOMAIN;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **${domain}** processed — [Directory Board](https://fmfalgun.github.io/gobuster-recon/dir-board.html)`
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed'
            });
